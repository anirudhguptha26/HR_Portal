{% extends 'employees/base.html' %}
{% block title %}Login - HR Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center"><i class="bi bi-people-fill"></i> HR Portal Login</h4>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
          <p class="text-center mt-3 mb-0">
    New employee? <a href="{% url 'signup' %}">Create an account</a>
</p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
